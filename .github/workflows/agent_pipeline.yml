name: AI Job Radar Pipeline

on:
  schedule:
    # Daily 13:30 UTC (5:30 AM PT), before the daily Claude scan reads the board.
    - cron: '30 13 * * *'
  push:
    # Rebuild the site when the daily Claude run updates picks or the company radar.
    branches: [main]
    paths:
      - 'data/picks.json'
      - 'data/companies.json'
      - 'scrapers/**'
      - 'main.py'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper + fit filter
        run: python main.py

      - name: Commit seen jobs back to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          git commit -m "chore: update jobs.json with latest scrape [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash || true
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
