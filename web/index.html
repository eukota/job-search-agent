<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Job Radar</title>
  <meta name="description" content="Remote Staff+ roles in agent infrastructure, AI developer productivity and forward-deployed AI, plus a radar of companies that pay well for them.">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>AI Job Radar</h1>
        <p class="sub">Remote US · Staff+ · agent infra, AI dev productivity, forward-deployed, AI-native founding roles</p>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
    </div>
    <nav class="wrap tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="picks" aria-selected="true">Top picks</button>
      <button role="tab" class="tab" data-tab="matches" aria-selected="false">All matches</button>
      <button role="tab" class="tab" data-tab="companies" aria-selected="false">Company radar</button>
    </nav>
  </header>

  <main class="wrap">
    <section id="tab-picks" class="panel" role="tabpanel">
      <p class="note" id="picks-note"></p>
      <ol id="picks" class="list"></ol>
      <div id="company-notes"></div>
    </section>

    <section id="tab-matches" class="panel" role="tabpanel" hidden>
      <div class="filters">
        <input id="q" type="search" placeholder="Search title, company, location…" aria-label="Search">
        <select id="lane" aria-label="Lane"><option value="">All lanes</option></select>
        <select id="company" aria-label="Company"><option value="">All companies</option></select>
        <select id="minpay" aria-label="Minimum pay">
          <option value="0">Any pay</option>
          <option value="200000">Top of range ≥ $200k</option>
          <option value="250000">≥ $250k</option>
          <option value="300000">≥ $300k</option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="fit">Sort: best fit</option>
          <option value="new">Sort: newest</option>
          <option value="pay">Sort: highest pay</option>
        </select>
        <label class="check"><input id="hideops" type="checkbox" checked> Hide on-call flavored</label>
      </div>
      <p class="note" id="matches-count"></p>
      <ul id="matches" class="list"></ul>
    </section>

    <section id="tab-companies" class="panel" role="tabpanel" hidden>
      <div class="filters">
        <select id="tier" aria-label="Tier">
          <option value="">All tiers</option>
          <option value="A">Tier A: top pay + remote in lane</option>
          <option value="B">Tier B: strong on one</option>
        </select>
      </div>
      <div id="companies" class="grid"></div>
    </section>
  </main>

  <footer class="wrap foot">
    Roles: scraped daily from company job boards and filtered for fit. Picks and new companies: added by a daily Claude scan.
    <span id="updated"></span>
  </footer>
  <script src="script.js"></script>
</body>
</html>
